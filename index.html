<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Valentine's Invitation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="./assets/favicon/icon.webp" type="image/x-icon">
  <script defer src="script.js"></script>
</head>
<body>


  <div class="card" id="envelopeScreen">
    <div class="envelope" id="envelope">
      <div class="flap"></div>
    </div>
    <p>Click the envelope 💌</p>
  </div>


  <div class="card hidden" id="questionScreen">
    <h1>Will you be my Valentine? 💖</h1>
    <div class="buttons">
      <button id="yesBtn">Yes 💕</button>
      <button id="noBtn">No 🙈</button>
    </div>
  </div>


  <div class="card hidden" id="optionsScreen">
    <h1>Yay! 💘</h1>
    <p>Let’s plan our date ✨</p>
    <div class="options">
      <div class="option" onclick="openWear()">👗 What to wear</div>
      <div class="option" onclick="openEat()">🍽️ Where to eat</div>
      <div class="option" onclick="openMovie()">🎬 Movie / Activity</div>
      <div class="option" onclick="openTime()">⏰ Pick-up time</div>
      <div class="option" onclick="showSummary()">📋 View plan</div>
    </div>
  </div>


  <div class="card hidden" id="subScreen">
    <h1 id="subTitle"></h1>
    <div class="options" id="subOptions"></div>
  </div>

 

</body>
</html>
